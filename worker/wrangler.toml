name = "pixel-radio-presence"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# One SQLite-backed Durable Object holds accounts, friendships and live sockets.
[[durable_objects.bindings]]
name = "HUB"
class_name = "PresenceHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PresenceHub"]

[vars]
# Comma-separated site origins allowed to use the API: the live site plus local dev/preview.
ALLOWED_ORIGINS = "https://pixelradios.com,https://www.pixelradios.com,http://localhost:5173,http://localhost:4173"
# Relay plain-http station streams so the HTTPS site can play them: "on" or "off".
# Switch it here and run `npm run worker:deploy`; a change made in the
# dashboard works at once but is reset to this value by the next deploy.
STREAM_RELAY = "on"
